# Build, test and wire-format conformance gate for the Python host.
#
# ── Layout ───────────────────────────────────────────────────────────────────
# The conformance corpus is its own public repository. The test suite resolves
# it as a SIBLING of this repo root (tests/_corpus.py walks to
# `<container>/wire-format-fixtures`), so this repo is checked out into a
# subdirectory and the corpus beside it:
#
#     $GITHUB_WORKSPACE/
#     ├── fuaran-py/               ← this repo
#     └── wire-format-fixtures/    ← the corpus (fuaran-ui/fuaran-ui-specification)
#
# The corpus repository is PUBLIC, so the checkout is anonymous — no token.
#
# ── Why the corpus assertion below is not optional ───────────────────────────
# When the corpus is absent, tests/_corpus.py does NOT fail — it silently falls
# back to the committed offline snapshot under conformance/corpus/. A layout
# drift would therefore leave the suite certifying against a stale local copy of
# the spec while the job stayed green, which is the one failure mode a
# conformance gate must never have. The assertion turns that into a hard stop.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # ── QUARANTINE ──────────────────────────────────────────────────────────────────────────
  # Cases that fail on a clean tree are excluded from the blocking gate here, so
  # that a NEW regression is caught while known drift stays visible. An entry is
  # not a judgement that a case is wrong — it is a record of known, understood,
  # outstanding work, and the list SHRINKS TO EMPTY as the decoder catches up.
  # Delete entries as they start passing; do not add to it to make a red build
  # green without a root-cause note — a new failure here is the regression this
  # gate exists to catch.
  #
  # EMPTY as of 2026-08-13: the Toggle/Now/Switch vocabulary landed
  # (3ac3c87/8e9fac3), the offline corpus snapshot was re-synced (392abd6), and
  # every formerly quarantined case passes against the current corpus —
  # verified by the full suite at 1627 passed with zero deselections AND each
  # former entry re-run by node ID (24 passed). The machinery stays armed; a
  # future corpus advance repopulates the list the same way.
  QUARANTINE: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the declared floor (pyproject requires-python); 3.13 stays as the
        # workspace's own interpreter. Both must pass, or the floor is a claim.
        python-version: ['3.12', '3.13']
        # The `live-host` extra carries what `samples/fastapi-host/` needs to be
        # TESTED. Both rows are needed and they prove different things: with the
        # extra, `tests/test_fastapi_host.py` gates — the sample's credential
        # containment is asserted rather than assumed; without it, the suite is
        # proven to skip CLEANLY, which is what lets `fuaran-ui` claim to be
        # dependency-light. Before this axis existed only the second arrangement
        # ever ran, so the sample's tests skipped on every run in a green job.
        extras: ['dev', 'dev,live-host']
    name: "Test (py${{ matrix.python-version }}, ${{ matrix.extras }})"
    defaults:
      run:
        working-directory: fuaran-py
    steps:
      - uses: actions/checkout@v7
        with:
          path: fuaran-py

      # Deliberately UNPINNED: the corpus is the shared conformance authority
      # every host certifies against, and one current spec for all hosts is the
      # point of giving it a single home. Pinning here would let this host drift
      # from the spec without anything going red.
      - name: Check out the wire-format conformance corpus
        uses: actions/checkout@v7
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures
          # Full history, because the drift step below measures the DISTANCE
          # between the committed snapshot's recorded commit and this HEAD. The
          # default depth of 1 holds HEAD and nothing else, under which that
          # distance is unmeasurable — the check would report "unknown" on every
          # run and the number the report exists to give would never appear.
          fetch-depth: 0

      - name: Assert the corpus is where the tests resolve it
        run: test -f ../wire-format-fixtures/manifest.json

      # ── The reference host, for the render-parity oracles ────────────────────
      # The class-vocabulary parity lock and the reference-stylesheet byte-copy
      # check read the F# reference host's own sources. Before this step those
      # oracles SKIPPED here — this job was a single-host checkout, which is the
      # one shape in which skipping is honest, and the note further down said so
      # at length. Honest is not the same as useful: the drift they exist to
      # catch was therefore visible only on a maintainer's workspace checkout,
      # so a stale oracle looked valid everywhere a machine actually ran it, and
      # the one that mattered had gone vacuous for months.
      #
      # Sparse: only the renderer projects are read (the vocabulary derivation
      # globs `src/Fuaran.UI.Renderer*`, and the stylesheet lives under one of
      # them), so the checkout stays small. The repo is PUBLIC — anonymous, no
      # token — and deliberately UNPINNED, for the reason the corpus checkout
      # above gives: pinning would let this host drift from the reference
      # without anything going red.
      - name: Check out the F# reference host (render-parity oracles)
        uses: actions/checkout@v7
        with:
          repository: fuaran-ui/fuaran-dotnet
          path: fuaran-dotnet
          sparse-checkout: src/Fuaran.UI.Renderer*
          sparse-checkout-cone-mode: false

      - name: Assert the reference host is where the oracles resolve it
        run: test -d ../fuaran-dotnet/src/Fuaran.UI.Renderer.Core

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Non-blocking, on every push: how far the committed offline snapshot
      # (conformance/corpus/, and the authority commit it records in
      # snapshot.json) has fallen behind the authority at HEAD.
      #
      # It is a WARN and not a gate on purpose. A snapshot lagging the authority
      # is not by itself a defect — the suite certifies against the AUTHORITY
      # here, so a lagging snapshot changes nothing about what this run proved,
      # and reddening main for it would train people to ignore it. What it does
      # is make the distance visible before the release gesture, where the same
      # check IS a refusal (publish-pypi.yml). The first v0.1.0 tag failed its
      # gated test_corpus_sync because the authority had moved twice after CI
      # passed on that head, and nothing between the two runs said so.
      #
      # Needs no install: the check is standard library plus git.
      - name: Corpus snapshot drift (reported, non-blocking)
        continue-on-error: true
        run: |
          set +e
          python conformance/sync_corpus.py --check 2>&1 | tee corpus-drift.log
          status=${PIPESTATUS[0]}
          {
            echo "### Corpus snapshot vs the authority"
            echo
            echo '```'
            cat corpus-drift.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${{ matrix.extras }}]"

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Type check (mypy)
        run: python -m mypy

      # Print what this gate does NOT cover, on every run. A cap nobody can see
      # reads as "covered everything".
      - name: Report the conformance quarantine
        run: |
          if [ -n "$QUARANTINE" ]; then
            echo "The blocking gate below EXCLUDES these known-failing cases:"
            echo "$QUARANTINE" | tr ' ' '\n' | grep -v '^--deselect$' | sed 's/^/  - /'
          else
            echo "Quarantine EMPTY — the blocking gate covers the full conformance suite."
          fi
          echo
          echo "ALSO NOT GATED HERE — inert rather than quarantined (see the skip"
          echo "summary that -rs prints under each test run below):"
          echo "  - NOTHING, on the reference-renderer parity axis, as of Phase 1654."
          echo "    This job now checks the F# reference host out beside the corpus, so"
          echo "    the class-vocabulary parity lock and the stylesheet byte-copy check"
          echo "    GATE here rather than skipping. They used to skip, honestly and"
          echo "    uselessly: this was a single-host checkout, which is the one shape in"
          echo "    which skipping is right, and the consequence was that the oracle ran"
          echo "    only on a maintainer's workspace checkout. It had been VACUOUS for"
          echo "    months when that was finally measured — admitting every possible"
          echo "    class through one over-broad prefix extracted from a doc comment —"
          echo "    and no run anywhere would have said so."
          echo "  - the FastAPI sample-host tests, on the rows that install [dev] ALONE."
          echo "    fastapi is a sample-only dependency, so the skip there is honest and is"
          echo "    itself the evidence that this package is dependency-light. The [dev,live-host]"
          echo "    rows install it and those tests GATE — read the matrix row name to know"
          echo "    which arrangement this run is."
          {
            echo "### Conformance quarantine (excluded from the blocking gate)"
            echo
            if [ -n "$QUARANTINE" ]; then
              echo '```'
              echo "$QUARANTINE" | tr ' ' '\n' | grep -v '^--deselect$'
              echo '```'
            else
              echo "Empty — the blocking gate covers the full conformance suite."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Non-blocking: runs the FULL suite so the size of the existing drift is
      # measured on every run rather than inferred from the quarantine list.
      - name: Conformance drift (reported, non-blocking)
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q -rs > drift.log 2>&1
          status=$?
          tail -40 drift.log
          {
            echo "### Full suite, including quarantined cases (non-blocking)"
            echo
            echo '```'
            grep -E '^[0-9]+ (failed|passed)|failed,|passed,' drift.log | tail -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # THE GATE. Everything the suite currently passes, including every
      # conformance case outside the quarantine above.
      - name: Test (gated)
        run: python -m pytest -q -rs $QUARANTINE
