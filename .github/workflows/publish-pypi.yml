# Publish fuaran-ui to PyPI on a version tag, via PyPI Trusted Publishing (OIDC — no stored token).
#
# THE PROJECT IS `fuaran-ui`; THE REPOSITORY IS STILL `fuaran-py`. Registry names carry the
# domain and drop the language (`Fuaran.UI.*`, `@fuaran-ui/*`, the `fuaran-ui` crate,
# `io.fuaran:fuaran-ui`), while repo names stay — `fuaran-ui/fuaran-py` is disambiguated by the
# org, and renaming it would cost redirects, CI checkouts, corpus resolvers and `workspace.json`
# for no consumer-visible gain.
#
# THE `fuaran-py` PROJECT ON PYPI IS LEFT EXACTLY AS IT STANDS (operator decision, 2026-09-10).
# Its releases up to 0.5.0 remain downloadable and must remain so — a public demo page and three
# CI workflows still install them by exact version. It is never re-tagged and never published to
# again; there is no deprecation shim, because nothing has ever consumed it as a dependency.
#
# Trigger: a `v*` tag push only. A branch push reaches no publish job.
# Prerequisites (one-time, on pypi.org): register a PENDING PUBLISHER for the NEW project —
# project `fuaran-ui`, owner `fuaran-ui`, repository `fuaran-py`, workflow `publish-pypi.yml`,
# environment `pypi` — then create the `pypi` environment on this repository. The registration
# that named project `fuaran-py` does NOT carry over: a trusted-publisher policy is scoped to a
# project name, so the first `fuaran-ui` tag fails at the OIDC exchange until the new pending
# publisher exists. That is the right failure — loud, and before any artefact is uploaded.
# The tag must equal the version in pyproject.toml; the gate below refuses otherwise, so a
# mistyped tag never publishes a mismatched release.
#
# WHAT THIS WORKFLOW REFUSES TO PUBLISH, and why each refusal exists:
#   * a tag whose version does not match pyproject.toml — the `build` job's version gate;
#   * a tree whose suite is red — the `test` job below, which `publish` `needs`. Until it
#     existed, a `v*` tag published whatever was at that commit having run no test, no lint
#     and no type check: the ONLY gate on the released artefact was that it built. CI runs
#     the same checks on a branch push, but a tag push is a different event on a different
#     ref, so "CI was green on main" was never a statement about the tagged commit;
#   * a version PyPI already serves — `skip-existing` is deliberately absent. With it, a
#     re-tag of an already-published version exited 0 having uploaded nothing, so a release
#     that silently did not happen was indistinguishable from one that did. Without it the
#     run fails, by name, and the fix is to cut a new version.
#   * a tree whose committed corpus snapshot is behind the authority — the `test` job's
#     corpus-drift refusal, which runs FIRST and names both commits and the re-sync command.
#     Both this workflow and CI check the corpus out at HEAD, so a snapshot that matched when
#     CI passed can be behind it minutes later when the tag is cut; the first v0.1.0 tag failed
#     that way, deep inside `test_corpus_sync`, and had to be withdrawn and re-cut. Refusing up
#     front makes the failure read as what it is — a stale snapshot, not a broken host.
#
# ── THE STEP A RELEASE OFTEN NEEDS AND NOTHING ELSE ASKS FOR: the no-op re-sync ──────────
#
# The drift refusal above compares the authority COMMIT the snapshot records against the
# authority's HEAD, and nothing else. It is deliberately not a payload diff: the authority is
# a REPOSITORY, and a snapshot that cannot say which revision of it was copied cannot answer
# "is this current" at all — only "do these bytes happen to match today's", which is a
# different and weaker claim. `conformance/corpus/snapshot.json` is what carries the answer.
#
# The cost of that choice, which is real and lands on the person cutting a tag: a corpus
# commit touching NO bundled fixture — a README edit, a doc pointer, a change under
# `conformance/` or `dag/` or any path the sync does not copy — still moves the authority's
# HEAD, so the recorded commit no longer equals it and this job refuses, with the snapshot's
# payload byte-for-byte correct. The refusal is accurate ("your snapshot was taken from an
# older revision") and reads as alarming ("the corpus moved and you did not adopt it").
#
# So the recipe is: BEFORE cutting a `v*` tag, run
#
#     python conformance/sync_corpus.py
#
# and commit whatever it writes — frequently `conformance/corpus/snapshot.json` alone. That
# is a legitimate, expected commit and not a workaround; it is the snapshot recording which
# revision of the authority it was last checked against. Run it even when you are confident
# no fixture changed: confirming it costs one command, and discovering it costs a withdrawn
# tag (the version cannot simply be re-tagged — `skip-existing` is absent above, on purpose).
#
# Do NOT "fix" this by making `--check` diff the payload instead. That would report a stale
# snapshot as current whenever the authority's change happened to miss the copied set, which
# is precisely the state a release must not be able to enter unknowingly.
name: publish-pypi

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The gate on the TAGGED tree. Mirrors ci.yml's blocking steps — the corpus
  # checkout it certifies against, the lint/format/type checks, and the suite —
  # on the release interpreter. Its failure is what stops `publish` below.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuaran-py
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuaran-py

      # Deliberately UNPINNED, for the reason ci.yml states: the corpus is the
      # shared conformance authority and one current spec for all hosts is the
      # point of giving it a single home.
      - name: Check out the wire-format conformance corpus
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          path: wire-format-fixtures
          # Full history — the refusal below reports how many commits the
          # snapshot is behind, which the default depth of 1 cannot answer.
          fetch-depth: 0

      # Every corpus-dependent test skips when the corpus is absent, so a layout
      # drift would retire the conformance leg and still report green. Assert it.
      - name: Assert the corpus is where the tests resolve it
        run: test -f ../wire-format-fixtures/manifest.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # THE RELEASE-PATH REFUSAL, and deliberately the FIRST thing this job
      # decides — before the install, the lint, the type check and the suite.
      #
      # The same check CI runs as a warning on every push is a hard refusal here,
      # because the two workflows differ in exactly the way that matters: on a
      # push a lagging snapshot costs nothing (the suite certifies against the
      # authority it just checked out), while on a tag the gated
      # `test_corpus_sync` compares the snapshot to a HEAD that may have moved
      # since CI passed. That is not hypothetical — it is how the first v0.1.0
      # tag failed and had to be withdrawn.
      #
      # Running it first is the whole point. The same staleness reached as a
      # `test_corpus_sync` failure two minutes into pytest reads as a broken
      # host; reached here it reads as what it is, and the message carries both
      # commits and the one command that fixes it.
      #
      # Needs no install: the check is standard library plus git.
      - name: Refuse a corpus snapshot behind the authority
        run: python conformance/sync_corpus.py --check

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format)
        run: python -m ruff format --check .

      - name: Type check (mypy)
        run: python -m mypy

      - name: Test (gated)
        run: python -m pytest -q -rs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Version gate — tag must equal pyproject version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python - <<'PY'
          import tomllib
          print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])
          PY
          )"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag does not match pyproject version $ver" >&2
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    # BOTH, not just `build`: a green build says the artefact assembles, which is
    # not a statement about whether the code in it works.
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # SHA-PINNED, not tag-pinned: this step holds the OIDC-minted publishing
      # identity, so a moved `release/v1` is credential-bearing code nobody
      # reviewed. `# v1.14.2` records which release the digest is; Dependabot's
      # `github-actions` schedule proposes the bumps as reviewable PRs.
      #
      # `skip-existing` is deliberately ABSENT — see the header. A re-tag of an
      # already-published version must fail, not exit 0 having uploaded nothing.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
