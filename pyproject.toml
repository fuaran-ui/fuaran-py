[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuaran-py"
version = "0.0.1"
description = "Python host of the Fuaran UI language — a co-equal sibling to the F# and TypeScript tiers (canonical-JSON codec, validator, and headless renderer today; ergonomic authoring surface + interactive runtime incoming)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrew J. Willshire", email = "andrew@fuaran.com" }]
keywords = ["fuaran", "wire-format", "canonical-json", "ui", "codec"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []   # dependency-light: the codec uses only the Python standard library.

[project.optional-dependencies]
# Dev-only tooling. The runtime codec stays standard-library-only (see CLAUDE.md);
# jsonschema (the schema-validity conformance leg) and hypothesis (generative
# cross-host parity) are test dependencies, never imported by src/fuaran_py.
# ruff floors at 0.16 and caps below 0.17. From 0.16 `ruff format` also formats
# python inside markdown code blocks; that arrived through an unpinned CI install
# and changed the gate with no commit (README.md went red 2026-08-27 while local
# 0.15.x passed), so 0.16 was capped OUT until the reformat could be taken
# deliberately. It has been: the README blocks were reformatted and the floor
# raised in the same commit, which is what makes the formatting a decision rather
# than something that happened. The upper bound is the half that keeps working —
# it is not distrust of any particular release, it is that a formatter which can
# rewrite the gate must not be able to do so between two runs of it. Adopting the
# next minor is the same deliberate act: reformat, then move both bounds.
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.16,<0.17", "jsonschema>=4.23", "hypothesis>=6.100"]

[project.urls]
Homepage = "https://github.com/fuaran-ui/fuaran-py"
Repository = "https://github.com/fuaran-ui/fuaran-py"

[tool.hatch.build.targets.wheel]
packages = ["src/fuaran_py"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src/fuaran_py"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
